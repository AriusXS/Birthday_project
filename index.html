<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something for you</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Intro Stage (Blurred Overlay & Heart Balloon) -->
    <div id="intro-stage">
        <div id="intro-balloon-wrapper">
            <!-- Heart Balloon & Long Anchor String -->
            <svg id="heart-balloon-svg" viewBox="0 0 100 240" preserveAspectRatio="xMidYMin meet">
                <defs>
                    <radialGradient id="heartGradient" cx="35%" cy="30%" r="65%">
                        <stop offset="0%" stop-color="#ffb7d2" />
                        <stop offset="35%" stop-color="#f48fb1" />
                        <stop offset="70%" stop-color="#d81b60" />
                        <stop offset="100%" stop-color="#880e4f" />
                    </radialGradient>
                    <filter id="heartGlow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#f48fb1" flood-opacity="0.5"/>
                    </filter>
                </defs>

                <g filter="url(#heartGlow)">
                    <!-- Heart Shape -->
                    <path d="M 50 32 C 50 32, 28 10, 15 24 C 2 38, 14 58, 50 88 C 86 58, 98 38, 85 24 C 72 10, 50 32, 50 32 Z" fill="url(#heartGradient)" />
                    <!-- Realistic 3D Specular Highlight -->
                    <path d="M 32 24 C 22 24, 18 32, 22 42 C 24 36, 28 30, 36 27 Z" fill="#ffffff" opacity="0.65" />
                    <!-- Balloon Knot -->
                    <polygon points="46,87 54,87 50,93" fill="#880e4f" />
                </g>

                <!-- Long String Going Below Edge -->
                <path class="intro-string" d="M 50 93 C 45 130, 58 170, 48 240" />
            </svg>
            <p class="pop-hint">Touch it!</p>
        </div>

        <!-- Confetti & Ribbon Explosion Canvas -->
        <canvas id="pop-canvas"></canvas>
    </div>

    <!-- Ambient Lighting & Vignette Overlay -->
    <div id="ambient-overlay"></div>

    <!-- Fixed Background Layer (Title & Balloons) -->
    <div id="balloon-background">
        <div id="balloon-container"></div>
    </div>

    <!-- Floating Scroll Indicator -->
    <div id="scroll-indicator" class="scroll-indicator">
        <span>Scroll Down</span>
        <svg class="scroll-arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
    </div>

    <!-- Audio Element for Section 2 (Looping) -->
    <audio id="bg-music" src="song/song_1.mp3" preload="auto" loop></audio>

    <!-- Main Scroll Container -->
    <main>
        
        <!-- SECTION 1: HERO & AGE COUNTER -->
        <section class="page" id="section-1">
            <div class="hero-card">
                <h1 class="birthday-title">Hii <span class="highlight">Adi,</span> <br/> Happy Birthday tooo U</h1>

                <!-- Live Age Counter Grid -->
                <div class="counter-grid">
                    <div class="counter-box">
                        <span id="years">00</span>
                        <label>Years</label>
                    </div>
                    <div class="counter-box">
                        <span id="months">00</span>
                        <label>Months</label>
                    </div>
                    <div class="counter-box">
                        <span id="days">00</span>
                        <label>Days</label>
                    </div>

                    <div class="counter-box">
                        <span id="hours">00</span>
                        <label>Hours</label>
                    </div>
                    <div class="counter-box">
                        <span id="minutes">00</span>
                        <label>Mins</label>
                    </div>
                    <div class="counter-box">
                        <span id="seconds">00</span>
                        <label>Secs</label>
                    </div>
                </div>

                <!-- Decorated Photo Frame -->
                <div class="photo-container">
                    <div class="photo-glow-ring"></div>
                    <div class="photo-wrapper">
                        <img id="her-display" src="pic/bd_girl.jpg" alt="Her Photo">
                    </div>
                    <div class="photo-badge">✨ Birthday Girl ✨</div>
                </div>
            </div>
        </section>

        <!-- SECTION 2: THE LETTER & MUSIC -->
        <section class="page" id="section-2">
            <div class="ambient-glow"></div>

            <div class="section2-container">
                <!-- Sealed Envelope -->
                <div id="envelope-wrapper" class="envelope-wrapper">
                    <div class="envelope" id="envelope">
                        <div class="top-flap"></div>
                        <div class="pocket"></div>
                        <div class="seal">🌸</div>
                    </div>
                    <p class="click-hint">Open it</p>
                </div>

                <!-- Glassmorphic Paper Card -->
                <div id="glass-card" class="glass-card hidden">
                    <div class="glass-header">
                        <span class="card-subtitle">A message for you</span>
                    </div>
                    <div class="glass-content" id="typewriter-content">
                        <!-- Handwritten text appears dynamically here -->
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Unified Script -->
    <script src="script.js"></script>

</body>
</html>
